[package]
name = "ffx-studio-app"
description = "FFX Studio: the desktop app (Tauri window around ffx-studio)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not part of the main workspace: building it needs a webview (WebView2 on
# Windows). Build it with `tools/build-app.sh`.
[workspace]

[[bin]]
name = "ffx-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ffx-studio = { path = "../../crates/ffx-studio" }
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
