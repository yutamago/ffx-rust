[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
ffx-audio-census = { path = "crates/ffx-audio-census" }
ffx-auto = { path = "crates/ffx-auto" }
ffx-battle = { path = "crates/ffx-battle" }
ffx-bridge = { path = "crates/ffx-bridge" }
ffx-chara = { path = "crates/ffx-chara" }
ffx-core = { path = "crates/ffx-core" }
ffx-dxbc = { path = "crates/ffx-dxbc" }
ffx-field = { path = "crates/ffx-field" }
ffx-fxdraw = { path = "crates/ffx-fxdraw" }
ffx-gfx = { path = "crates/ffx-gfx" }
ffx-graphic = { path = "crates/ffx-graphic" }
ffx-harness = { path = "crates/ffx-harness" }
ffx-hook = { path = "crates/ffx-hook" }
ffx-kernel = { path = "crates/ffx-kernel" }
ffx-menu = { path = "crates/ffx-menu" }
ffx-monster = { path = "crates/ffx-monster" }
ffx-motion = { path = "crates/ffx-motion" }
ffx-movie = { path = "crates/ffx-movie" }
ffx-pcui = { path = "crates/ffx-pcui" }
ffx-postfx = { path = "crates/ffx-postfx" }
ffx-phyre = { path = "crates/ffx-phyre" }
ffx-platform = { path = "crates/ffx-platform" }
ffx-ps2 = { path = "crates/ffx-ps2" }
ffx-script = { path = "crates/ffx-script" }
ffx-sg = { path = "crates/ffx-sg" }
ffx-sound = { path = "crates/ffx-sound" }
ffx-studio = { path = "crates/ffx-studio" }
ffx-system = { path = "crates/ffx-system" }
ffx-text = { path = "crates/ffx-text" }
ffx-uidraw = { path = "crates/ffx-uidraw" }
ffx-vbf = { path = "crates/ffx-vbf" }
ffx-vfx = { path = "crates/ffx-vfx" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
goblin = { version = "0.10.7", default-features = false, features = ["pe32", "std"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
single_match_else = "allow"
# Archive paths are lowercase by construction.
case_sensitive_file_extension_comparisons = "allow"
