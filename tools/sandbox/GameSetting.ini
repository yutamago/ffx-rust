# The test sandbox's settings (docs/harness.md, "Sandbox settings"): every
# harness game (replays, game tests, captures) starts from this file, never
# from the user's GameSetting.ini, which is not read. ffx-harness drops these
# comment lines when it writes the sandbox's copy and sets MasterVolume from
# FFX_TEST_VOLUME (default 5).
# All values are those the sandbox copied from the user's file until
# 2026-10-24, which the replays were recorded with (key bindings included:
# the harness presses the keys bound to the PS2 buttons).
Language=en
Quality=VQ_LOW
VoiceVolume=100
MusicVolume=100
SFXVolume=100
Brightness=50
VSync=Off
Anisotropic=1
Shadow=0
# Low texture quality on purpose (the user, 2026-10-24: tests don't need
# high-quality textures). TQ_LOW drops the top 2 mip levels of every texture.
TextureQuality=TQ_LOW
MSAA=0
ColorCorrection=On
PostAA=PAA_OFF
UnSharpMask=Off
HDAO=Off
Invincible=Off
EncounterRate=ER_NORMAL
