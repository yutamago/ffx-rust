# ffx-rust's release packages (docs/host.md, "The release package"):
# tools/package-release.sh once per platform, each on its own runner (native
# builds, no cross-compiling), then one GitHub release with the archives.
#
# - A tag v* builds every platform and publishes a release with the
#   platforms in PUBLISHED below.
# - Run by hand (Actions, Release, Run workflow), or on a pull request that
#   changes the packaging, it builds every platform and keeps the archives
#   as the run's artifacts; nothing is published.
#
# Steam: each package carries Steam's library when its repository secret
# holds it (base64; from the Steamworks SDK's redistributable_bin):
# STEAM_API64_DLL_B64 (win64/steam_api64.dll), LIBSTEAM_API_LINUX64_B64
# (linux64/libsteam_api.so), LIBSTEAM_API_LINUXARM64_B64
# (linuxarm64/libsteam_api.so), LIBSTEAM_API_OSX_B64
# (osx/libsteam_api.dylib). Without it the package is built with
# --without-steam: the game runs, achievements stay off.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # a change to the packaging builds every package (nothing is published)
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/package-release.sh
      - tools/release-files.py
      - tools/check-licences.py
      - tools/check-privacy.py

permissions:
  contents: read

env:
  # The platforms a tag publishes. A platform joins when ffx-rust plays on
  # it; until then its archive is only a workflow artifact. Linux and macOS
  # have the native platform (window, input, sound, Steam:
  # crates/ffx-host/src/platform/native.rs) but draw on the null device until
  # the wgpu back end lands, so they are built but not published.
  PUBLISHED: "win64"
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            steam: STEAM_API64_DLL_B64
            steam_path: win64/steam_api64.dll
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            steam: LIBSTEAM_API_OSX_B64
            steam_path: osx/libsteam_api.dylib
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            steam: LIBSTEAM_API_LINUX64_B64
            steam_path: linux64/libsteam_api.so
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            steam: LIBSTEAM_API_LINUXARM64_B64
            steam_path: linuxarm64/libsteam_api.so
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # the files as committed (LF): Git for Windows would check the
      # scripts out with CRLF, which bash refuses
      - name: Line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: ". -> target/package"

      - name: LLVM's resource compiler (ffx-rust.exe's icon)
        if: runner.os == 'Windows'
        run: echo "C:\\Program Files\\LLVM\\bin" >>"$GITHUB_PATH"

      # the native platform's system libraries: ALSA (cpal's sound) and
      # udev (gilrs' pads); winit loads X11 and Wayland at run time
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Dependencies
        run: cargo fetch --locked

      - name: Steam (optional)
        id: steam
        env:
          LIB_B64: ${{ secrets[matrix.steam] }}
          LIB_PATH: ${{ matrix.steam_path }}
          SECRET: ${{ matrix.steam }}
        run: |
          if [[ -n "$LIB_B64" ]]; then
              sdk="$RUNNER_TEMP/steamworks/sdk"
              mkdir -p "$(dirname "$sdk/redistributable_bin/$LIB_PATH")"
              printf '%s' "$LIB_B64" | base64 -d >"$sdk/redistributable_bin/$LIB_PATH"
              echo "STEAMWORKS_SDK=$sdk" >>"$GITHUB_ENV"
          else
              echo "no $SECRET secret: the package is built without $(basename "$LIB_PATH")"
              echo "flags=--without-steam" >>"$GITHUB_OUTPUT"
          fi

      - name: Package
        env:
          PYTHON: python
          FFX_RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          [[ -z "$FFX_RELEASE_LABEL" ]] && unset FFX_RELEASE_LABEL
          tools/package-release.sh --target "${{ matrix.target }}" --out dist ${{ steps.steam.outputs.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffx-rust-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=()
          for p in $PUBLISHED; do
              for f in dist/ffx-rust-*-"$p".zip dist/ffx-rust-*-"$p".tar.gz; do
                  [[ -f "$f" ]] && files+=("$f")
              done
          done
          if [[ ${#files[@]} -eq 0 ]]; then
              echo "no archive for the platforms in PUBLISHED ($PUBLISHED)" >&2
              exit 1
          fi
          (cd dist && sha256sum "${files[@]#dist/}") >SHA256SUMS.txt
          pre=()
          [[ "$TAG" == v0.* || "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --title "ffx-rust $TAG" --generate-notes "${pre[@]}"
