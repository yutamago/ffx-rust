[package]
name = "ffx-hook"
description = "Patches FFX.exe functions to jump into their Rust reimplementations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ffx-auto.workspace = true
ffx-battle.workspace = true
ffx-bridge.workspace = true
ffx-chara.workspace = true
ffx-core.workspace = true
ffx-draw = { path = "../ffx-draw" }
ffx-field.workspace = true
ffx-gfx.workspace = true
ffx-graphic.workspace = true
ffx-glue-other.workspace = true
ffx-pload.workspace = true
ffx-prender.workspace = true
ffx-panim.workspace = true
ffx-pother-a.workspace = true
ffx-pcore.workspace = true
ffx-kernel.workspace = true
ffx-menu.workspace = true
ffx-monster.workspace = true
ffx-motion.workspace = true
ffx-movie.workspace = true
ffx-pcui.workspace = true
ffx-pother-b.workspace = true
ffx-ps2.workspace = true
ffx-script.workspace = true
ffx-scene = { path = "../ffx-scene" }
ffx-sg.workspace = true
ffx-sound.workspace = true
ffx-system.workspace = true
ffx-text.workspace = true
ffx-vfx.workspace = true

[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
# FFX_MAGIC_EMU=1: the spell overlays in Unicorn (overlay_emu.rs)
ffx-overlay.workspace = true

[target.'cfg(windows)'.dependencies]
# the Rust audio engine's output device (rust_audio_out.rs); MIT
wasapi = "0.26"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
