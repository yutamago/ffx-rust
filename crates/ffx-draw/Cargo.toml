[package]
name = "ffx-draw"
description = "The in-process renderer core: pipeline-state layer and a thin backend trait, D3D11 first"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ffx-gfx.workspace = true

# The same version as ffx-render's (one copy in the lock file).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
