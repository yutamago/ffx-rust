[package]
name = "ffx-swf"
description = "The PC screens' Flash movies played by Ruffle (M5 pilot): Iggy call logs replayed offline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ffx-vbf.workspace = true
futures = "0.3"
png = "0.18"
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# Ruffle (MIT OR Apache-2.0), from the user's fork: upstream rev 07d3e430
# plus one commit with three opt-in switches (bitmap mipmaps, forced
# smoothing, a deterministic getTimer) and blur rounding; docs/formats/pc-ui.md
# "Ruffle". A dependency only; no Ruffle code is copied.
ruffle_core = { git = "https://github.com/yutamago/ruffle", rev = "23dc65800b90050f059cda78b2d6b64dd79976fc" }
ruffle_render_wgpu = { git = "https://github.com/yutamago/ruffle", rev = "23dc65800b90050f059cda78b2d6b64dd79976fc" }

[lints]
workspace = true
