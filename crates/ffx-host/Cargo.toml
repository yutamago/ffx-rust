[package]
name = "ffx-host"
description = "Runs FFX without loading FFX.exe: the arena, the function table and the development-only Unicorn fallback (docs/host.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ffx-rust"
path = "src/bin/ffx-rust.rs"

# The tests that run original code in Unicorn (compare with it, or boot
# through code without a port) need the emulator; tests/no_unicorn.rs is
# the build without it, tests/overlay_bind.rs runs in both.
[[test]]
name = "boot"
required-features = ["dev-unicorn"]
[[test]]
name = "crt"
required-features = ["dev-unicorn"]
[[test]]
name = "crt_dll"
required-features = ["dev-unicorn"]
[[test]]
name = "free_play"
required-features = ["dev-unicorn"]
[[test]]
name = "m5_system_a"
required-features = ["dev-unicorn"]
[[test]]
name = "m5_vfx_stubs"
required-features = ["dev-unicorn"]
[[test]]
name = "m5p_physics"
required-features = ["dev-unicorn"]
[[test]]
name = "m5p_stubs"
required-features = ["dev-unicorn"]
[[test]]
name = "overlay"
required-features = ["dev-unicorn"]
[[test]]
name = "seh"
required-features = ["dev-unicorn"]
[[test]]
name = "steam"
required-features = ["dev-unicorn"]
[[test]]
name = "table"
required-features = ["dev-unicorn"]
[[test]]
name = "x87"
required-features = ["dev-unicorn"]

[features]
default = ["dev-unicorn"]
# Development only: the executor runs FFX.exe's functions that have no
# port yet in Unicorn (docs/host.md, "Rust and Unicorn"). Unicorn is
# GPL-2.0: the release builds without it (tools/check-licences.py), and
# then a call to an address with no Rust side is a hard stop that names
# it (docs/host.md, "Without Unicorn").
dev-unicorn = ["dep:unicorn-engine", "ffx-fpu/unicorn"]
# Iggy's players on Ruffle (ffx-swf); without it the players are null.
swf = ["dep:ffx-swf"]

[dependencies]
ffx-bridge.workspace = true
ffx-core.workspace = true
ffx-fpu.workspace = true
ffx-gfx.workspace = true
ffx-host-ports.workspace = true
ffx-kernel.workspace = true
# the spell overlays' Rust ports, bound by code identity (src/library.rs)
ffx-magic.workspace = true
ffx-sound.workspace = true
# The Flash screens on Ruffle (src/iggy/swf.rs): heavy (wgpu), so a feature.
ffx-swf = { workspace = true, optional = true }
goblin.workspace = true
md-5.workspace = true
miniz_oxide.workspace = true
thiserror.workspace = true
unicorn-engine = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# FMOD's device output (src/audio.rs `device`: the hook's rust_audio_out.rs),
# the hook's version
wasapi = "0.26"
# The real device behind the game's D3D11 calls (src/d3d11.rs); the same
# version as ffx-draw's and ffx-render's.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
# tests/m5p_stubs.rs: the stubs table (host-only entries)
ffx-pcore.workspace = true

[lints]
workspace = true
