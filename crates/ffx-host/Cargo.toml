[package]
name = "ffx-host"
description = "Runs FFX without loading FFX.exe: the arena, the function table and the development-only Unicorn fallback (docs/host.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ffx-rust"
path = "src/bin/ffx-rust.rs"

[features]
default = ["dev-unicorn"]
# Development only: the executor runs FFX.exe's functions that have no
# port yet in Unicorn (docs/host.md, "Rust and Unicorn"); gone before the
# stage 4 gate. Unicorn is GPL-2.0: the release builds without it
# (tools/check-licences.py). Until the executor has a path without
# Unicorn, the crate refuses to build with the feature off.
dev-unicorn = ["dep:unicorn-engine", "ffx-fpu/unicorn"]
# Iggy's players on Ruffle (ffx-swf); without it the players are null.
swf = ["dep:ffx-swf"]

[dependencies]
ffx-bridge.workspace = true
ffx-core.workspace = true
ffx-fpu.workspace = true
ffx-gfx.workspace = true
ffx-host-ports.workspace = true
ffx-kernel.workspace = true
ffx-sound.workspace = true
# The Flash screens on Ruffle (src/iggy/swf.rs): heavy (wgpu), so a feature.
ffx-swf = { workspace = true, optional = true }
goblin.workspace = true
md-5.workspace = true
miniz_oxide.workspace = true
thiserror.workspace = true
unicorn-engine = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# The real device behind the game's D3D11 calls (src/d3d11.rs); the same
# version as ffx-draw's and ffx-render's.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
