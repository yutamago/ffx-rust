[package]
name = "ffx-host"
description = "Runs FFX without loading FFX.exe: the arena, the function table and the development-only Unicorn fallback (docs/host.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ffx-rust"
path = "src/bin/ffx-rust.rs"

[dependencies]
ffx-bridge.workspace = true
ffx-core.workspace = true
ffx-fpu = { workspace = true, features = ["unicorn"] }
ffx-gfx.workspace = true
ffx-kernel.workspace = true
goblin.workspace = true
md-5.workspace = true
thiserror.workspace = true
# Development only: runs FFX.exe's functions that have no port yet
# (docs/host.md, "Rust and Unicorn"); gone before the stage 4 gate.
unicorn-engine.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }
# The real device behind the game's D3D11 calls (src/d3d11.rs); the same
# version as ffx-draw's and ffx-render's.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
