[package]
name = "ffx-host"
description = "Runs FFX without loading FFX.exe: the arena, the function table and the development-only Unicorn fallback (docs/host.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ffx-rust"
path = "src/bin/ffx-rust.rs"

[dependencies]
ffx-bridge.workspace = true
ffx-core.workspace = true
ffx-kernel.workspace = true
goblin.workspace = true
thiserror.workspace = true
# Development only: runs FFX.exe's functions that have no port yet
# (docs/host.md, "Rust and Unicorn"); gone before the stage 4 gate.
unicorn-engine.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

[lints]
workspace = true
