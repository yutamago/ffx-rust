[package]
name = "ffx-launch"
description = "Starts FFX.exe with bottom-up ASLR off (replays, snapshots), or with --rust ffx-rust.exe on the player's game folder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
