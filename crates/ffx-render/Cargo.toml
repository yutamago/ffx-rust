[package]
name = "ffx-render"
description = "The external renderer: draws the game's scene with wgpu from the scene stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ffx-dxbc.workspace = true
ffx-gfx.workspace = true
anyhow.workspace = true
miniz_oxide.workspace = true
pollster = "0.4"
wgpu = "30.0.1"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
