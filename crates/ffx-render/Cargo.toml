[package]
name = "ffx-render"
description = "The external renderer: draws the game's scene with wgpu from the scene stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ffx-dxbc.workspace = true
ffx-gfx.workspace = true
ffx-vbf.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
miniz_oxide.workspace = true
pollster = "0.4"
egui = "0.36.2"
wgpu = "30.0.1"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
# The same version as wgpu-hal's, for its Direct3D 12 objects.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }
